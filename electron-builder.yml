appId: com.notesmanager.app
productName: Note Manager
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,SPEC.md,CLAUD.md,GEMINI.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!build/google-client.json'
  - '!e2e/**'
  - '!docs/**'
  - '!scripts/**'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: x64
  executableName: note-manager
  # Never request elevation: no UAC prompt, no admin needed to install or run.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  perMachine: false            # per-user install into %LOCALAPPDATA%\Programs
  allowElevation: false
  artifactName: note-manager-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
npmRebuild: false
electronDist: node_modules/electron/dist
